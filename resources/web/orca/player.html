<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stream</title>
<style>
html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #000; display: flex; }
</style>
</head>
<body>
<!-- Snapmaker-Ultra: the go2rtc stream player, served by the hub instead of by go2rtc (whose API is
     credential-only and never reachable from a browser). video-stream.js and video-rtc.js next to
     this file are verbatim copies from go2rtc 1.9.14 (MIT, see resources/tools/go2rtc/LICENSE-NOTE.txt)
     and must be refreshed together with go2rtc.exe.
     ?src=<stream name>&mode=<mse|webrtc|webrtc,mse|mp4|mjpeg>[&lt=<hub secret; the PC's own Stream tab only>]
     The WebSocket goes to api/ws on the hub, which attaches go2rtc's credentials; WebRTC signalling
     (offer / answer / candidate) rides that same WebSocket, so nothing else has to be opened. -->
<script type="module" src="./video-stream.js"></script>
<script type="module">
    const params = new URLSearchParams(location.search);
    const lt = params.get('lt');
    const video = document.createElement('video-stream');
    video.background = params.get('background') !== 'false';
    video.mode = params.get('mode') || video.mode;
    video.style.flex = '1 0 ' + (params.get('width') || '320px');
    video.src = new URL('api/ws?src=' + encodeURIComponent(params.get('src') || '') + (lt ? '&lt=' + encodeURIComponent(lt) : ''), location.href);
    document.body.appendChild(video);

    // Tell the embedding page (stream_center.html) the stream's real aspect ratio, so it can give
    // this tile a matching shape instead of assuming 16:9 and letterboxing a 4:3 camera (the
    // Snapmaker U1's is 4:3). We are same-origin with the parent - the hub serves both pages - so
    // the message is posted to location.origin and the parent checks e.origin the same way.
    // <video-stream> builds its one <video> in oninit() (from connectedCallback), and every mode it
    // can settle on - mse / webrtc / mp4 / mjpeg - paints into that same element, so watching it
    // covers all of them. This module runs after ./video-stream.js (both are modules, in document
    // order), so the element is already defined and the append above has upgraded it; the poll is
    // only a belt-and-braces for a browser that upgrades late.
    const bind = () => {
        const inner = video.video || video.querySelector('video');
        if (!inner) return false;
        let last = 0;
        const post = (w, h) => {
            if (!w || !h) return;
            const ar = w / h;
            if (Math.abs(ar - last) < 0.001) return; // the same number, over and over, on 'resize'
            last = ar;
            try {
                parent.postMessage({ snorcaAspect: ar, src: params.get('src') || '' }, location.origin);
            } catch (e) {}
        };
        const report = () => post(inner.videoWidth, inner.videoHeight);
        // 'resize' fires whenever the decoded frame size changes (a camera switching profile, or
        // the first frame after a reconnect); 'loadedmetadata' is the first report of the two.
        inner.addEventListener('loadedmetadata', report);
        inner.addEventListener('resize', report);
        report(); // metadata may already be in (a warm element)
        // mjpeg is the one mode that paints into video.poster instead of decoding into the element,
        // so videoWidth stays 0 there and neither event above ever fires. The poster is replaced
        // frame by frame and its intrinsic size is the frame size, so look at it a few times after
        // the stream starts and stop as soon as one reports (or the modes that do decode do).
        let posterTries = 0;
        const pt = setInterval(() => {
            if (last || ++posterTries > 20) { clearInterval(pt); return; }
            if (inner.videoWidth) { report(); return; }
            if (!inner.poster) return;
            const probe = new Image();
            probe.onload = () => post(probe.naturalWidth, probe.naturalHeight);
            probe.src = inner.poster;
        }, 500);
        return true;
    };
    if (!bind()) {
        let tries = 0;
        const t = setInterval(() => { if (bind() || ++tries > 40) clearInterval(t); }, 250);
    }
    // With mode=webrtc,mse the player runs both at once and swaps to WebRTC as soon as it has a
    // picture, so MSE is already playing while the peer connection is negotiated. If WebRTC has
    // not taken over by then (the PC's firewall blocks go2rtc's media port, or the network drops
    // UDP), stop it: the browser would otherwise keep an ICE agent and a second decode alive
    // behind a stream the viewer can already see. MSE is untouched and keeps playing.
    const both = video.mode.includes('webrtc') && video.mode.includes('mse');
    const giveUp = parseInt(params.get('rtctimeout') || '8000', 10);
    if (both && giveUp > 0) setTimeout(() => {
        if (video.pcState === WebSocket.OPEN || !video.pc) return; // WebRTC won, or was never started
        video.pcState = WebSocket.CLOSED;
        video.pc.close();
        video.pc = null;
    }, giveUp);
</script>
</body>
</html>
