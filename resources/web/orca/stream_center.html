<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1f1f">
<title>Stream</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #2b2b2b; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
#topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 12px; background: #1f1f1f; padding-top: calc(10px + env(safe-area-inset-top)); padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 16px; background: #4a4a4a; color: #fff; font-size: 13px; cursor: pointer; user-select: none; -webkit-user-select: none; white-space: nowrap; }
.chip.active { background: #0a9e50; }
.chip.over { outline: 2px solid #5fd08a; }
.chip .icon { opacity: 0.7; font-size: 12px; padding: 0 2px; }
.chip .icon:hover { opacity: 1; }
#addchip { background: #3a3a3a; border: 1px dashed #777; }
#spacer { flex: 1; }
select { background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
#layoutbox { display: inline-flex; align-items: center; gap: 4px; color: #aaa; font-size: 12px; }
#grid { position: absolute; top: var(--bar-h, 52px); left: 0; right: 0; bottom: 0; display: grid; gap: 4px; padding: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); padding-left: calc(4px + env(safe-area-inset-left)); padding-right: calc(4px + env(safe-area-inset-right)); background: #2b2b2b; overflow-y: auto; overflow-x: hidden; align-content: start; -webkit-overflow-scrolling: touch; }
#grid::-webkit-scrollbar { width: 10px; }
#grid::-webkit-scrollbar-track { background: #222; }
#grid::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
#grid::-webkit-scrollbar-thumb:hover { background: #777; }
.cell { position: relative; background: #000; border-radius: 4px; overflow: hidden; }
.cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cell .label { -webkit-touch-callout: none; }
@media (min-width: 641px) and (max-width: 1100px) and (pointer: coarse) { /* tablets */
    .chip { font-size: 14px; padding: 8px 12px; }
    select { font-size: 14px; padding: 7px 10px; }
    .cell .label { font-size: 13px; padding: 3px 10px; }
}
.cell .label { position: absolute; left: 8px; top: 6px; z-index: 2; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; cursor: grab; user-select: none; }
.cell.empty { border: 1px dashed #555; background: #262626; }
.cell.over { outline: 2px solid #5fd08a; outline-offset: -2px; }
body.dragging .cell iframe, body.dragging .cell img { pointer-events: none; }
#note { color: #999; font-size: 12px; }
#modal-bg { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
#modal { background: #333; border-radius: 8px; padding: 18px; min-width: 360px; max-width: 480px; max-height: 92vh; overflow-y: auto; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
#modal h3 { font-size: 15px; margin-bottom: 12px; font-weight: 600; }
#modal .field { margin-bottom: 10px; }
#modal .field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
#modal .field .info { font-size: 12px; color: #bbb; line-height: 1.4; background: #2a2a2a; border-radius: 5px; padding: 7px 9px; }
#modal .field .status { font-size: 12px; color: #999; margin-top: 4px; }
#modal input, #modal select { width: 100%; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 7px 9px; font-size: 13px; }
#modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#modal .buttons span, #modal .field .btn { display: inline-block; padding: 7px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; user-select: none; background: #555; }
#modal .ok { background: #0a9e50 !important; }
#modal .qr { display: block; margin: 10px auto; background: #fff; border-radius: 6px; }
#tabs { display: none; gap: 4px; margin-right: 6px; }
#tabs .tab { padding: 6px 12px; border-radius: 6px; background: #3a3a3a; color: #ccc; font-size: 13px; cursor: pointer; user-select: none; }
#tabs .tab.active { background: #0a9e50; color: #fff; }
.view { display: none; position: absolute; top: var(--bar-h, 52px); left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); color: #ddd; font-size: 13px; }
.view .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; color: #ccc; }
.view .btn { padding: 7px 14px; border-radius: 6px; background: #0a9e50; color: #fff; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; }
.view .btn.dim { background: #555; }
.view .btn.small { padding: 5px 10px; font-size: 12px; background: #3a3a3a; border: 1px dashed #777; }
.setup { background: #303030; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.setup .lbl { color: #9a9a9a; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
.setup .lbl:first-child { margin-top: 0; }
.setup select { width: 100%; background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.setup .filrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.setup .filrow .num { width: 22px; height: 22px; border-radius: 4px; background: #444; color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.setup .filrow input[type=color] { width: 34px; height: 34px; border: 1px solid #555; border-radius: 6px; padding: 0; background: #222; flex: none; }
.setup .filrow select { flex: 1; min-width: 0; }
.setup.busy { opacity: .6; pointer-events: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { background: #333; border-radius: 8px; overflow: hidden; color: #eee; }
.card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #222; }
.card .body { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 10px; }
.card .title { font-weight: 600; }
.card .meta { color: #aaa; font-size: 12px; line-height: 1.4; }
.card .bar { height: 6px; background: #222; margin: 0 10px 10px; border-radius: 3px; overflow: hidden; }
.card .bar div { height: 100%; background: #0a9e50; width: 0; transition: width .3s; }
.printer { background: #2f2f2f; border-left: 4px solid #555; border-radius: 6px; padding: 10px 12px; color: #ddd; margin-bottom: 8px; }
.printer.online { border-left-color: #0a9e50; }
.printer .name { font-weight: 600; margin-bottom: 4px; }
.printer .meta { color: #aaa; font-size: 12px; line-height: 1.5; }
.printer .temps { display: flex; gap: 14px; margin-top: 6px; }
.printer .temps div { background: #262626; border-radius: 6px; padding: 6px 10px; text-align: center; }
.printer .temps .v { font-size: 16px; color: #fff; }
.printer .temps .k { font-size: 11px; color: #888; }
#modal .url { font-family: Consolas, monospace; font-size: 12px; color: #9ed; text-align: center; word-break: break-all; user-select: all; }
@media (max-width: 640px) {
    #topbar { padding: 6px 8px; gap: 6px; }
    .chip { font-size: 12px; padding: 5px 8px; }
    #modal { min-width: 0; width: 92vw; }
}
</style>
</head>
<body>
<div id="topbar">
  <span id="tabs"><span class="tab active" data-view="streams">Streams</span><span class="tab" data-view="prepare">Prepare</span><span class="tab" data-view="devices">Devices</span></span>
  <span id="chips"></span>
  <span class="chip" id="addchip">+ Add</span>
  <span class="chip" id="phonechip" title="Open this camera wall on your phone">&#128241; Phone</span>
  <span id="spacer"></span>
  <span id="note"></span>
  <span id="layoutbox" title="Grid layout: columns x rows (drag a name to reorder)">
    <select id="cols"></select><span>&times;</span><select id="rows"></select>
  </span>
</div>
<div id="grid"></div>
<div id="prepare" class="view"></div>
<div id="devices" class="view"></div>
<div id="modal-bg"><div id="modal"></div></div>
<script>
(function() {
    var KEY = 'snorca_streams_v1';
    var MAX_DIM = 9;
    // hosts: [{id, ip, alias, kind, code, user, pass, profile, name}]; active: [id] in display order.
    var state = { hosts: [], active: [], layout: '1x1' };

    // Remote (phone) mode: the slicer serves this same page at http://<pc>:<port>/r/<token>/
    // (see RemoteAccess.cpp). The camera list then comes from the PC, read-only; only the
    // layout and order are kept on the phone.
    var REMOTE = (function() {
        var m = /^(\/r\/[a-z0-9]+)\/(?:index\.html)?$/.exec(location.pathname);
        return m ? m[1] + '/' : '';
    })();
    var REMOTE_KEY = 'snorca_remote_v1';
    if (REMOTE) {
        try { document.cookie = 'rt=' + REMOTE.split('/')[2] + '; path=/; SameSite=Lax'; } catch (e) {}
        document.getElementById('addchip').style.display = 'none';
        document.getElementById('phonechip').style.display = 'none';
    }

    function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    // Phone/tablet default grid from the screen: phones 1x2 / 2x1, tablets 2x3 / 3x2. Used until
    // the viewer picks a layout, and re-applied when the device is rotated.
    var remoteAutoLayout = true;
    function remoteDefaultLayout() {
        var w = window.innerWidth, h = window.innerHeight, tablet = Math.min(w, h) >= 600;
        return w > h ? (tablet ? '3x2' : '2x1') : (tablet ? '2x3' : '1x2');
    }
    function load() {
        if (REMOTE) {
            state = { hosts: [], active: [], layout: remoteDefaultLayout() };
            try {
                var r = JSON.parse(localStorage.getItem(REMOTE_KEY));
                if (r && r.layout && r.auto === false) { state.layout = r.layout; remoteAutoLayout = false; }
                if (r && Array.isArray(r.active)) state.active = r.active;
            } catch (e) {}
            return;
        }
        try {
            var s = JSON.parse(localStorage.getItem(KEY));
            if (s && Array.isArray(s.hosts)) state = s;
        } catch (e) {}
        if (!Array.isArray(state.active)) state.active = [];
        if (!state.layout) state.layout = '1x1';
        // Older versions keyed everything by IP: give those entries opaque ids (the phone only
        // ever sees ids) and remap the active list.
        var remap = {};
        state.hosts.forEach(function(h) { if (!h.id) { h.id = newId(); remap[h.ip] = h.id; } });
        state.active = state.active.map(function(a) { return remap[a] || a; });
        // Merge hosts handed over by the slicer (?seed=ip1,ip2)
        try {
            var seed = new URLSearchParams(location.search).get('seed');
            if (seed) seed.split(',').forEach(function(ip) {
                ip = ip.trim();
                if (ip && !state.hosts.some(function(h) { return h.ip === ip; }))
                    state.hosts.push({ id: ip, ip: ip, alias: '' });
            });
        } catch (e) {}
        var ids = {};
        state.hosts.forEach(function(h) { ids[h.id] = true; });
        state.active = state.active.filter(function(id, i, a) { return ids[id] && a.indexOf(id) === i; });
    }
    function save() {
        if (REMOTE) {
            try { localStorage.setItem(REMOTE_KEY, JSON.stringify({ layout: state.layout, active: state.active, auto: remoteAutoLayout })); } catch (e) {}
            return;
        }
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        pushState();
    }
    // Hand the slicer the full list plus, per host, what a phone needs: the source kind, the
    // go2rtc stream name/source or the direct page URL. Credentials stay inside the app.
    function remoteDescriptor(h) {
        var kind = kindOf(h);
        if (kind === 'flashforge') {
            var u = ffUrls[h.ip];
            if (u && /^rtsps?:\/\//i.test(u)) kind = 'rtsp-url', h = { ip: u };
            else if (u) return { rkind: 'url', rurl: u };
            else return { rkind: 'flashforge' };
        }
        if (kind === 'p1') return { rkind: 'p1' };
        if (kind === 'url') return { rkind: 'url', rurl: streamSrc(h) };
        var src = go2rtcSrc(h, kind);
        return { rkind: 'go2rtc', rname: 's' + hashStr(src), rsrc: src };
    }
    function pushState() {
        var hosts = state.hosts.map(function(h) {
            var d = remoteDescriptor(h), out = {};
            for (var k in h) out[k] = h[k];
            for (var k2 in d) out[k2] = d[k2];
            return out;
        });
        postToSlicer('stream_state:' + JSON.stringify({ hosts: hosts, active: state.active }));
    }
    // Phone mode: pull the list from the PC now and every 15 s.
    function fetchRemoteState() {
        fetch(REMOTE + 'state').then(function(r) { return r.json(); }).then(function(s) {
            var hosts = (s && s.hosts) || [];
            var known = {};
            hosts.forEach(function(h) { known[h.id] = true; });
            var changed = JSON.stringify(hosts) !== JSON.stringify(state.hosts);
            state.hosts = hosts;
            var before = state.active.join(',');
            state.active = state.active.filter(function(id) { return known[id]; });
            if (state.active.length === 0) state.active = ((s && s.active) || []).filter(function(id) { return known[id]; });
            if (changed || before !== state.active.join(',')) {
                // Cells built before the list arrived (or for changed entries) must be rebuilt.
                if (changed) document.querySelectorAll('#grid .cell').forEach(function(cell) { cell.remove(); });
                save(); render();
            }
            document.getElementById('note').textContent = state.hosts.length === 0 ? 'No cameras set up on the PC yet' : '';
        }).catch(function(e) {
            console.error('state refresh failed', e);
            document.getElementById('note').textContent = 'Lost contact with the slicer';
        });
    }
    function hostById(id) { return state.hosts.filter(function(x) { return x.id === id; })[0]; }
    function validHost(ip) {
        // bare host, or a full stream URL used verbatim (http(s) pages; rtsp(s)/onvif fed through go2rtc)
        return /^(https?|rtsps?|onvif):\/\/\S+$/i.test(ip) || /^[A-Za-z0-9.:\-_]+$/.test(ip);
    }
    function hashStr(s) {
        var h = 0x811c9dc5;
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
        return h.toString(16);
    }
    // The slicer's webview injects the app-wide "wx" script channel; the panel
    // listens for our messages on it. ("snorca" was never injected on Edge.)
    function postToSlicer(msg) {
        try { window.wx.postMessage(msg); return; } catch (e) {}
        try { window.snorca.postMessage(msg); } catch (e) {}
    }
    var relayPort = 0;
    try { relayPort = parseInt(new URLSearchParams(location.search).get('relay')) || 0; } catch (e) {}
    function kindOf(h) {
        if (/^(rtsps?|onvif):\/\//i.test(h.ip)) return 'rtsp-url'; // a pasted stream URL wins over the picked type
        if (h.kind === 'rtsps' || h.kind === 'flashforge' || h.kind === 'ipcam' || h.kind === 'wyze') return h.kind;
        if (h.kind === 'p1' || (h.code && h.kind !== 'auto-url')) return 'p1';
        return 'url';
    }
    function isBambu(h) { return kindOf(h) === 'p1'; }
    function streamSrc(h) {
        if (isBambu(h))
            return 'http://127.0.0.1:' + relayPort + '/bambu?ip=' + encodeURIComponent(h.ip) + '&code=' + encodeURIComponent(h.code);
        return /^https?:\/\//i.test(h.ip) ? h.ip : 'http://' + h.ip + '/webcam/webrtc';
    }
    function userInfo(h) {
        return h.user ? encodeURIComponent(h.user) + ':' + encodeURIComponent(h.pass || '') + '@' : '';
    }
    function withPort(host, port) { return /:\d+$/.test(host) ? host : host + ':' + port; }
    // Generic IP camera: go2rtc asks the camera over ONVIF for its stream URL
    // (subtype 0 = main profile, 1 = sub stream), then pulls RTSP.
    function onvifSrc(h) {
        return 'onvif://' + userInfo(h) + withPort(h.ip, 80) + '?subtype=' + (h.profile === 'sub' ? '1' : '0');
    }
    // Wyze: no open protocol. Either docker-wyze-bridge (host + camera name, RTSP on 8554)
    // or Wyze's RTSP firmware (camera IP, stream at /live).
    function wyzeSrc(h) {
        if (h.name) return 'rtsp://' + userInfo(h) + withPort(h.ip, 8554) + '/' + encodeURIComponent(h.name);
        return 'rtsp://' + userInfo(h) + h.ip + '/live';
    }
    function go2rtcSrc(h, kind) {
        return kind === 'rtsp-url' ? h.ip
             : kind === 'ipcam'    ? onvifSrc(h)
             : kind === 'wyze'     ? wyzeSrc(h)
             : 'rtspx://bblp:' + encodeURIComponent(h.code) + '@' + h.ip + ':322/streaming/live/1';
    }

    // go2rtc relay (RTSP/ONVIF sources): started by the slicer on request.
    var go2rtcPort = 0, go2rtcRequested = false, go2rtcFailed = false, go2rtcStreams = {};
    window.__go2rtcReady = function(p) {
        go2rtcPort = p || 0;
        go2rtcFailed = !go2rtcPort;
        render();
    };
    function ensureGo2rtc() {
        if (go2rtcPort || go2rtcRequested) return;
        go2rtcRequested = true;
        postToSlicer('start_go2rtc');
    }
    function go2rtcCell(cell, src) {
        var name = 's' + hashStr(src);
        if (!go2rtcStreams[name]) {
            go2rtcStreams[name] = true;
            fetch('http://127.0.0.1:' + go2rtcPort + '/api/streams?name=' + name + '&src=' + encodeURIComponent(src), { method: 'PUT' })
                .catch(function() { go2rtcStreams[name] = false; });
        }
        var f = document.createElement('iframe');
        f.allow = 'autoplay';
        f.src = 'http://127.0.0.1:' + go2rtcPort + '/stream.html?src=' + name + '&mode=mse';
        cell.appendChild(f);
    }
    function relayWaitCell(cell) {
        ensureGo2rtc();
        var wait = document.createElement('div');
        wait.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:' + (go2rtcFailed ? '#c66' : '#888') + ';font-size:13px;text-align:center;padding:8px;';
        wait.textContent = go2rtcFailed ? 'Stream relay failed to start - restart the app and check the log for Go2RtcLauncher errors.' : 'Starting stream relay…';
        cell.appendChild(wait);
        cell.dataset.id = ''; // rebuild this cell once the relay reports in
    }
    // ONVIF WS-Discovery on the LAN, answered by go2rtc: cb(list | null, errorText)
    function discoverOnvif(cb) {
        ensureGo2rtc();
        var tries = 0;
        (function wait() {
            if (go2rtcPort) return doFetch();
            if (go2rtcFailed || ++tries > 60) return cb(null, 'Stream relay is not available');
            setTimeout(wait, 250);
        })();
        function doFetch() {
            fetch('http://127.0.0.1:' + go2rtcPort + '/api/onvif')
                .then(function(r) { return r.text().then(function(t) { return { ok: r.ok, text: t }; }); })
                .then(function(res) {
                    if (!res.ok) return cb([], /no sources/i.test(res.text) ? '' : res.text.trim());
                    var list = [];
                    try { var j = JSON.parse(res.text); list = (j && j.sources) || (Array.isArray(j) ? j : []); } catch (e) {}
                    cb(list.map(function(s) {
                        var url = s.url || '';
                        var m = /^[a-z]+:\/\/(?:[^@\/]*@)?([^\/?#]+)/i.exec(url);
                        return { name: s.name || url, host: m ? m[1] : url };
                    }), '');
                })
                .catch(function(e) { cb(null, String(e)); });
        }
    }

    // Flashforge (Creator 5 / Adventurer 5M family): the printer reports its own
    // camera URL through the LAN detail API; the slicer probes it for us because
    // the printer sends no CORS headers. rtsp:// results ride go2rtc, MJPEG http://
    // results embed directly.
    var ffUrls = {}; // ip -> stream url, '' = probe failed, undefined = pending
    window.__ffDetail = function(ip, url) {
        ffUrls[ip] = url || '';
        render();
        pushState(); // the phone can use the probed URL too
    };
    function ffCell(h, cell) {
        var url = ffUrls[h.ip];
        if (url === undefined) {
            postToSlicer('ff_detail:' + h.ip);
            var wait = document.createElement('div');
            wait.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;';
            wait.textContent = 'Contacting printer…';
            cell.appendChild(wait);
            return;
        }
        if (url === '') {
            var err = document.createElement('div');
            err.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c66;font-size:12px;text-align:center;padding:8px;';
            err.textContent = 'No camera URL from ' + h.ip + ':8898. If you know the stream address, re-add this printer using the full rtsp:// URL.';
            cell.appendChild(err);
            return;
        }
        if (/^rtsps?:\/\//i.test(url)) {
            if (go2rtcPort) go2rtcCell(cell, url); else relayWaitCell(cell);
        } else if (/action=stream/i.test(url)) {
            var im = document.createElement('img');
            im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
            im.src = url;
            cell.appendChild(im);
        } else {
            var f2 = document.createElement('iframe');
            f2.allow = 'autoplay';
            f2.src = url;
            cell.appendChild(f2);
        }
    }
    // Phone mode cells: everything comes through the slicer's token-gated listener.
    function remoteCell(h, cell) {
        var msg = null;
        if (h.rkind === 'go2rtc') {
            var f = document.createElement('iframe');
            f.allow = 'autoplay';
            f.setAttribute('scrolling', 'no'); // iOS otherwise grows the frame to its content
            f.src = '/stream.html?src=' + encodeURIComponent(h.rname) + '&mode=mse';
            cell.appendChild(f);
        } else if (h.rkind === 'p1') {
            var im = document.createElement('img');
            im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
            im.src = REMOTE + 'bambu?id=' + encodeURIComponent(h.id);
            cell.appendChild(im);

        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h ? h + 'h ' + m + 'm' : m + 'm';
    }
    function setView(v) {
        view = v;
        document.querySelectorAll('#tabs .tab').forEach(function(t) { t.classList.toggle('active', t.dataset.view === v); });
        document.getElementById('grid').style.display = v === 'streams' ? '' : 'none';
        document.getElementById('prepare').style.display = v === 'prepare' ? 'block' : 'none';
        document.getElementById('devices').style.display = v === 'devices' ? 'block' : 'none';
        document.getElementById('chips').style.display = v === 'streams' ? '' : 'none';
        document.getElementById('layoutbox').style.display = v === 'streams' ? '' : 'none';
        if (viewTimer) { clearInterval(viewTimer); viewTimer = null; }
        if (v === 'prepare') { lastPresetsJson = ''; refreshPrepare(); viewTimer = setInterval(refreshPrepare, 10000); }
        if (v === 'devices') { refreshDevices(); viewTimer = setInterval(refreshDevices, 5000); }
        try { localStorage.setItem('snorca_remote_view', v); } catch (e) {}
    }
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function fail(e) { document.getElementById('note').textContent = e.message || String(e); }
    function startSlice(plate) {
        api('/slice?plate=' + plate, { method: 'POST' }).then(function(j) {
            activeJob = j.job;
            pollJob();
        }).catch(fail);
    }
    function pollJob() {
        if (jobTimer) clearTimeout(jobTimer);
        if (activeJob === null) return;
        api('/jobs/' + activeJob).then(function(j) {
            document.querySelectorAll('#prepare .card').forEach(function(card) {
                var mine = j.plate === -1 || +card.dataset.index === j.plate;
                var bar = card.querySelector('.bar');
                if (bar) { bar.style.display = mine && j.state === 'running' ? '' : 'none'; bar.firstChild.style.width = j.percent + '%'; }
                var st = card.querySelector('.state');
                if (st && mine && j.state === 'running') st.textContent = 'Slicing… ' + j.percent + '%' + (j.text ? ' — ' + j.text.replace(/^Slicing/, '').trim() : '');
            });
            if (j.state === 'running') jobTimer = setTimeout(pollJob, 1000);
            else { activeJob = null; thumbStamp = Date.now(); lastPresetsJson = ''; refreshPrepare(); if (j.state === 'error') fail(new Error('Slicing failed: ' + j.error)); }
        }).catch(function() { jobTimer = setTimeout(pollJob, 2000); });
    }
    // Any change made here goes through the slicer's own sidebar code path.
    function postPreset(path, then) {
        var setup = document.querySelector('#prepare .setup');
        if (setup) setup.classList.add('busy');
        api(path, { method: 'POST' }).then(function() { lastPresetsJson = ''; refreshPrepare(); if (then) then(); })
            .catch(function(e) { fail(e); lastPresetsJson = ''; refreshPrepare(); });
    }
    function fillSelect(sel, items, current) {
        sel.innerHTML = '';
        var found = false;
        (items || []).forEach(function(it) {
            var o = el('option', '', it.name);
            o.value = it.value;
            if (it.value === current) { o.selected = true; found = true; }
            sel.appendChild(o);
        });
        if (!found && current) {
            var o2 = el('option', '', current);
            o2.value = current; o2.selected = true;
            sel.insertBefore(o2, sel.firstChild);
        }
    }
    function buildSetup(pr) {
        var setup = el('div', 'setup');
        setup.appendChild(el('div', 'lbl', 'Printer'));
        var sp = el('select');
        fillSelect(sp, pr.printer, pr.printer_name);
        sp.onchange = function() { postPreset('/presets/select?type=printer&name=' + encodeURIComponent(sp.value)); };
        setup.appendChild(sp);
        setup.appendChild(el('div', 'lbl', 'Filaments'));
        (pr.filaments || []).forEach(function(f) {
            var row = el('div', 'filrow');
            row.appendChild(el('span', 'num', String(f.index + 1)));
            var color = el('input');
            color.type = 'color';
            color.value = /^#[0-9a-fA-F]{6}$/.test(f.color) ? f.color : '#26a69a';
            color.title = 'Filament colour';
            color.onchange = function() { postPreset('/presets/filament_color?index=' + f.index + '&color=' + encodeURIComponent(color.value)); };
            row.appendChild(color);
            var sf = el('select');
            fillSelect(sf, pr.filament_choices, f.value);
            sf.onchange = function() { postPreset('/presets/select?type=filament&index=' + f.index + '&name=' + encodeURIComponent(sf.value)); };
            row.appendChild(sf);
            setup.appendChild(row);
        });
        var add = el('span', 'btn small', '+ Add filament');
        add.onclick = function() { postPreset('/presets/filament_add'); };
        setup.appendChild(add);
        setup.appendChild(el('div', 'lbl', 'Process'));
        var spr = el('select');
        fillSelect(spr, pr.process, pr.process_name);
        spr.onchange = function() { postPreset('/presets/select?type=process&name=' + encodeURIComponent(spr.value)); };
        setup.appendChild(spr);
        return setup;
    }
    function refreshPrepare() {
        var root = document.getElementById('prepare');
        Promise.all([api('/presets'), api('/plates')]).then(function(res) {
            var pr = res[0], data = res[1];
            var presetsJson = JSON.stringify(pr);
            var editing = root.contains(document.activeElement) && /^(SELECT|INPUT)$/.test(document.activeElement.tagName);
            var scroll = root.scrollTop;
            var setup = root.querySelector('.setup');
            if (!setup || (presetsJson !== lastPresetsJson && !editing)) {
                var fresh = buildSetup(pr);
                if (setup) root.replaceChild(fresh, setup); else root.insertBefore(fresh, root.firstChild);
                lastPresetsJson = presetsJson;
            }
            var rest = root.querySelector('.rest');
            if (rest) rest.remove();
            rest = el('div', 'rest');
            var head = el('div', 'row');
            head.appendChild(el('span', '', (data.project ? data.project.split(/[\\/]/).pop() : 'Untitled') + ' · ' + (data.plates || []).length + ' plate' + ((data.plates || []).length === 1 ? '' : 's')));
            head.appendChild(el('span', '', '')).style.flex = '1';
            var all = el('span', 'btn' + (data.slicing ? ' dim' : ''), 'Slice all');
            all.onclick = function() { if (!data.slicing) startSlice('all'); };
            head.appendChild(all);
            rest.appendChild(head);
            var cards = el('div', 'cards');
            (data.plates || []).forEach(function(p) {
                var card = el('div', 'card');
                card.dataset.index = p.index;
                var img = el('img');
                img.alt = 'Plate ' + (p.index + 1);
                img.src = REMOTE + 'api/plates/' + p.index + '/thumbnail.png?v=' + thumbStamp;
                img.onerror = function() { img.style.display = 'none'; };
                card.appendChild(img);
                var body = el('div', 'body');
                var left = el('div');
                left.appendChild(el('div', 'title', (p.name ? p.name : 'Plate ' + (p.index + 1)) + (p.index === data.current_plate ? ' ·' : '')));
                left.appendChild(el('div', 'meta state', p.sliced ? (fmtTime(p.time_s) + ' · ' + Math.round(p.filament_g || 0) + ' g' + (p.ready_for_print ? '' : ' · not printable')) : (p.printable ? 'Not sliced' : 'Empty')));
                body.appendChild(left);
                if (p.printable && !p.locked) {
                    var b = el('span', 'btn' + (data.slicing ? ' dim' : ''), p.sliced ? 'Re-slice' : 'Slice');
                    b.onclick = function() { if (!data.slicing && activeJob === null) startSlice(p.index); };
                    body.appendChild(b);
                }
                card.appendChild(body);
                var bar = el('div', 'bar');
                bar.appendChild(el('div'));
                bar.style.display = 'none';
                card.appendChild(bar);
                cards.appendChild(card);
            });
            rest.appendChild(cards);
            root.appendChild(rest);
            root.scrollTop = scroll;
            if (data.slicing && activeJob === null) {
                (data.plates || []).forEach(function(p) {
                    if (p.slicing_percent > 0 && !p.sliced) {
                        var c = cards.querySelector('.card[data-index="' + p.index + '"] .state');
                        if (c) c.textContent = 'Slicing on the PC… ' + Math.round(p.slicing_percent) + '%';
                    }
                });
            }
        }).catch(function(e) { root.innerHTML = ''; root.appendChild(el('div', 'row', 'Cannot reach the slicer: ' + e.message)); });
    }
    function refreshDevices() {
        var root = document.getElementById('devices');
        api('/printers').then(function(res) {
            var printers = res.printers || [];
            root.innerHTML = '';
            if (!printers.length) { root.appendChild(el('div', 'row', 'No printers known to the slicer yet')); return; }
            printers.forEach(function(p) {
                var card = el('div', 'printer' + (p.online ? ' online' : ''));
                card.appendChild(el('div', 'name', p.name + (p.selected ? ' ★' : '') + (p.model ? '  ·  ' + p.model : '')));
                var meta = p.online ? (p.status || 'idle') : 'offline';
                if (p.printing) meta += ' · ' + p.percent + '% · ' + fmtTime(p.left_time_s) + ' left' + (p.total_layers ? ' · layer ' + p.layer + '/' + p.total_layers : '');
                if (p.task) meta += ' · ' + p.task;
                card.appendChild(el('div', 'meta', meta));
                if (p.online) {
                    var temps = el('div', 'temps');
                    var bed = el('div'); bed.appendChild(el('div', 'v', Math.round(p.bed_temp) + '° / ' + Math.round(p.bed_target) + '°')); bed.appendChild(el('div', 'k', 'bed'));
                    temps.appendChild(bed);
                    (p.nozzles || []).forEach(function(n, i) {
                        var d = el('div'); d.appendChild(el('div', 'v', Math.round(n.temp) + '° / ' + Math.round(n.target) + '°')); d.appendChild(el('div', 'k', (p.nozzles.length > 1 ? 'nozzle ' + (i + 1) : 'nozzle')));
                        temps.appendChild(d);
                    });
                    card.appendChild(temps);
                }
                root.appendChild(card);
            });
        }).catch(function(e) { root.innerHTML = ''; root.appendChild(el('div', 'row', 'Cannot reach the slicer: ' + e.message)); });
    }
    if (REMOTE) {
        document.getElementById('tabs').style.display = 'inline-flex';
        document.querySelectorAll('#tabs .tab').forEach(function(t) { t.onclick = function() { setView(t.dataset.view); }; });
    }

    load();
    // Default: first host active in the default single-stream layout.
    if (state.active.length === 0 && state.hosts.length > 0) state.active = [state.hosts[0].id];
    save();
    render();
    if (REMOTE) {
        fetchRemoteState();
        setInterval(fetchRemoteState, 15000);
        var v = 'streams';
        try { v = localStorage.getItem('snorca_remote_view') || 'streams'; } catch (e) {}
        if (v === 'prepare' || v === 'devices' || v === 'plates') setView(v === 'plates' ? 'prepare' : v);
    }
})();
</script>
</body>
</html>
