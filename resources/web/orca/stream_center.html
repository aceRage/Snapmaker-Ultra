<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #2b2b2b; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
#topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 12px; background: #1f1f1f; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 16px; background: #4a4a4a; color: #fff; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; }
.chip.active { background: #0a9e50; }
.chip .icon { opacity: 0.7; font-size: 12px; padding: 0 2px; }
.chip .icon:hover { opacity: 1; }
#addchip { background: #3a3a3a; border: 1px dashed #777; }
#spacer { flex: 1; }
select { background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
#grid { position: absolute; top: var(--bar-h, 52px); left: 0; right: 0; bottom: 0; display: grid; gap: 4px; padding: 4px; background: #2b2b2b; }
.cell { position: relative; background: #000; border-radius: 4px; overflow: hidden; }
.cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cell .label { position: absolute; left: 8px; top: 6px; z-index: 2; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; pointer-events: none; }
.cell.empty { border: 1px dashed #555; background: #262626; }
#note { color: #999; font-size: 12px; }
#modal-bg { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
#modal { background: #333; border-radius: 8px; padding: 18px; min-width: 320px; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
#modal h3 { font-size: 15px; margin-bottom: 12px; font-weight: 600; }
#modal .field { margin-bottom: 10px; }
#modal .field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
#modal input { width: 100%; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 7px 9px; font-size: 13px; }
#modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#modal .buttons span { padding: 7px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; user-select: none; }
#modal .ok { background: #0a9e50; }
#modal .cancel { background: #555; }
</style>
</head>
<body>
<div id="topbar">
  <span id="chips"></span>
  <span class="chip" id="addchip">+ Add</span>
  <span id="spacer"></span>
  <span id="note"></span>
  <select id="layout" title="Grid layout">
    <option value="1x1">1 stream</option>
    <option value="2x1">2 side by side</option>
    <option value="1x2">2 stacked</option>
    <option value="2x2">2 x 2</option>
    <option value="3x2">3 x 2</option>
    <option value="3x3">3 x 3</option>
    <option value="4x3">4 x 3</option>
    <option value="4x4">4 x 4</option>
  </select>
</div>
<div id="grid"></div>
<div id="modal-bg"><div id="modal"></div></div>
<script>
(function() {
    var KEY = 'snorca_streams_v1';
    var state = { hosts: [], active: [], layout: '1x1' };

    function load() {
        try {
            var s = JSON.parse(localStorage.getItem(KEY));
            if (s && Array.isArray(s.hosts)) state = s;
        } catch (e) {}
        if (!Array.isArray(state.active)) state.active = [];
        if (!state.layout) state.layout = '1x1';
        // Merge hosts handed over by the slicer (?seed=ip1,ip2)
        try {
            var seed = new URLSearchParams(location.search).get('seed');
            if (seed) seed.split(',').forEach(function(ip) {
                ip = ip.trim();
                if (ip && !state.hosts.some(function(h) { return h.ip === ip; }))
                    state.hosts.push({ ip: ip, alias: '' });
            });
        } catch (e) {}
    }
    function save() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    function validHost(ip) {
        // bare host, or a full stream URL used verbatim (http(s) pages, or rtsp(s) fed through go2rtc)
        return /^(https?|rtsps?):\/\/\S+$/i.test(ip) || /^[A-Za-z0-9.:\-_]+$/.test(ip);
    }
    var relayPort = 0;
    try { relayPort = parseInt(new URLSearchParams(location.search).get('relay')) || 0; } catch (e) {}
    function kindOf(h) {
        if (h.kind === 'rtsps') return 'rtsps';
        if (/^rtsps?:\/\//i.test(h.ip)) return 'rtsp-url'; // a pasted rtsp:// URL wins over the picked type
        if (h.kind === 'flashforge') return 'flashforge';
        if (h.kind === 'p1' || (h.code && h.kind !== 'auto-url')) return 'p1';
        return 'url';
    }
    function isBambu(h) { return kindOf(h) === 'p1'; }
    function streamSrc(h) {
        if (isBambu(h))
            return 'http://127.0.0.1:' + relayPort + '/bambu?ip=' + encodeURIComponent(h.ip) + '&code=' + encodeURIComponent(h.code);
        return /^https?:\/\//i.test(h.ip) ? h.ip : 'http://' + h.ip + '/webcam/webrtc';
    }

    // go2rtc relay for RTSPS printers (X1/H2 family): started by the slicer on request.
    var go2rtcPort = 0, go2rtcRequested = false, go2rtcStreams = {};
    window.__go2rtcReady = function(p) {
        go2rtcPort = p || 0;
        render();
    };
    function ensureGo2rtc() {
        if (go2rtcPort || go2rtcRequested) return;
        go2rtcRequested = true;
        try { window.snorca.postMessage('start_go2rtc'); } catch (e) {}
    }
    function go2rtcCell(h, cell, srcOverride) {
        var name = h.ip.replace(/[^A-Za-z0-9]/g, '_');
        var src  = srcOverride || ('rtspx://bblp:' + encodeURIComponent(h.code) + '@' + h.ip + ':322/streaming/live/1');
        if (!go2rtcStreams[name]) {
            go2rtcStreams[name] = true;
            fetch('http://127.0.0.1:' + go2rtcPort + '/api/streams?name=' + name + '&src=' + encodeURIComponent(src), { method: 'PUT' })
                .catch(function() { go2rtcStreams[name] = false; });
        }
        var f = document.createElement('iframe');
        f.allow = 'autoplay';
        f.src = 'http://127.0.0.1:' + go2rtcPort + '/stream.html?src=' + name + '&mode=mse';
        cell.appendChild(f);
    }

    // Flashforge (Creator 5 / Adventurer 5M family): the printer reports its own
    // camera URL through the LAN detail API; the slicer probes it for us because
    // the printer sends no CORS headers. rtsp:// results ride go2rtc, MJPEG http://
    // results embed directly.
    var ffUrls = {}; // ip -> stream url, '' = probe failed, undefined = pending
    window.__ffDetail = function(ip, url) {
        ffUrls[ip] = url || '';
        render();
    };
    function ffCell(h, cell) {
        var url = ffUrls[h.ip];
        if (url === undefined) {
            try { window.snorca.postMessage('ff_detail:' + h.ip); } catch (e) {}
            var wait = document.createElement('div');
            wait.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;';
            wait.textContent = 'Contacting printer…';
            cell.appendChild(wait);
            return;
        }
        if (url === '') {
            var err = document.createElement('div');
            err.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c66;font-size:12px;text-align:center;padding:8px;';
            err.textContent = 'No camera URL from ' + h.ip + ':8898. If you know the stream address, re-add this printer using the full rtsp:// URL.';
            cell.appendChild(err);
            return;
        }
        if (/^rtsps?:\/\//i.test(url)) {
            if (go2rtcPort) { go2rtcCell(h, cell, url); }
            else {
                ensureGo2rtc();
                var wait2 = document.createElement('div');
                wait2.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;';
                wait2.textContent = 'Starting stream relay…';
                cell.appendChild(wait2);
                cell.dataset.ip = '';
            }
        } else if (/action=stream/i.test(url)) {
            var im = document.createElement('img');
            im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
            im.src = url;
            cell.appendChild(im);
        } else {
            var f2 = document.createElement('iframe');
            f2.allow = 'autoplay';
            f2.src = url;
            cell.appendChild(f2);
        }
    }
    // In-page modal: the embedded WebView does not service prompt()/confirm() dialogs.
    // opts = { title, message, fields: [{key,label,value,placeholder}] }; cb(null | {key:value})
    function showModal(opts, cb) {
        var bg = document.getElementById('modal-bg');
        var modal = document.getElementById('modal');
        modal.innerHTML = '';
        var h = document.createElement('h3');
        h.textContent = opts.title;
        modal.appendChild(h);
        if (opts.message) {
            var msg = document.createElement('div');
            msg.style.cssText = 'font-size:13px;color:#ccc;margin-bottom:8px;';
            msg.textContent = opts.message;
            modal.appendChild(msg);
        }
        var inputs = {};
        (opts.fields || []).forEach(function(f) {
            var wrap = document.createElement('div');
            wrap.className = 'field';
            var lab = document.createElement('label');
            lab.textContent = f.label;
            wrap.appendChild(lab);
            var inp;
            if (f.type === 'select') {
                inp = document.createElement('select');
                inp.style.cssText = 'width:100%;background:#222;color:#fff;border:1px solid #555;border-radius:5px;padding:7px 9px;font-size:13px;';
                (f.options || []).forEach(function(o) {
                    var opt = document.createElement('option');
                    opt.value = o.value;
                    opt.textContent = o.label;
                    inp.appendChild(opt);
                });
                if (f.value) inp.value = f.value;
            } else {
                inp = document.createElement('input');
                inp.value = f.value || '';
                inp.placeholder = f.placeholder || '';
            }
            wrap.appendChild(inp);
            modal.appendChild(wrap);
            inputs[f.key] = inp;
        });
        function close(result) {
            bg.style.display = 'none';
            modal.innerHTML = '';
            cb(result);
        }
        var buttons = document.createElement('div');
        buttons.className = 'buttons';
        var cancel = document.createElement('span');
        cancel.className = 'cancel';
        cancel.textContent = 'Cancel';
        cancel.onclick = function() { close(null); };
        buttons.appendChild(cancel);
        var ok = document.createElement('span');
        ok.className = 'ok';
        ok.textContent = 'OK';
        ok.onclick = function() {
            var values = {};
            for (var k in inputs) values[k] = inputs[k].value.trim();
            close(values);
        };
        buttons.appendChild(ok);
        modal.appendChild(buttons);
        bg.style.display = 'flex';
        modal.onkeydown = function(e) {
            if (e.key === 'Enter') ok.onclick();
            if (e.key === 'Escape') close(null);
        };
        var first = modal.querySelector('input');
        if (first) first.focus();
    }
    function cellCount(layout) {
        var p = layout.split('x');
        return { cols: +p[0], rows: +p[1], n: (+p[0]) * (+p[1]) };
    }
    function render() {
        var chips = document.getElementById('chips');
        chips.innerHTML = '';
        state.hosts.forEach(function(h) {
            var c = document.createElement('span');
            c.className = 'chip' + (state.active.indexOf(h.ip) !== -1 ? ' active' : '');
            var name = document.createElement('span');
            name.textContent = h.alias || h.ip;
            name.title = h.alias ? h.ip : 'Click to show/hide this stream';
            c.appendChild(name);
            var edit = document.createElement('span');
            edit.className = 'icon';
            edit.textContent = '✎';
            edit.title = 'Set alias';
            edit.onclick = function(e) {
                e.stopPropagation();
                showModal({ title: 'Alias for ' + h.ip, fields: [{ key: 'alias', label: 'Alias (empty to clear)', value: h.alias || '' }] }, function(r) {
                    if (r !== null) { h.alias = r.alias; save(); render(); }
                });
            };
            c.appendChild(edit);
            var del = document.createElement('span');
            del.className = 'icon';
            del.textContent = '✕';
            del.title = 'Remove';
            del.onclick = function(e) {
                e.stopPropagation();
                showModal({ title: 'Remove printer', message: 'Remove ' + (h.alias ? h.alias + ' (' + h.ip + ')' : h.ip) + ' from the list?' }, function(r) {
                    if (r === null) return;
                    state.hosts = state.hosts.filter(function(x) { return x.ip !== h.ip; });
                    state.active = state.active.filter(function(x) { return x !== h.ip; });
                    save(); render();
                });
            };
            c.appendChild(del);
            c.onclick = function() {
                var i = state.active.indexOf(h.ip);
                if (i === -1) state.active.push(h.ip); else state.active.splice(i, 1);
                save(); render();
            };
            chips.appendChild(c);
        });
        document.getElementById('layout').value = state.layout;

        var lay = cellCount(state.layout);
        var grid = document.getElementById('grid');
        var barH = document.getElementById('topbar').offsetHeight;
        grid.style.setProperty('--bar-h', barH + 'px');
        grid.style.top = barH + 'px';
        grid.style.gridTemplateColumns = 'repeat(' + lay.cols + ', 1fr)';
        grid.style.gridTemplateRows = 'repeat(' + lay.rows + ', 1fr)';

        var shown = state.active.slice(0, lay.n);
        var note = document.getElementById('note');
        note.textContent = state.active.length > lay.n
            ? (state.active.length - lay.n) + ' selected stream(s) hidden by layout'
            : (state.hosts.length === 0 ? 'Add a printer IP to start' : '');

        // Reuse existing iframes where the host has not changed to avoid reconnecting.
        var existing = {};
        Array.prototype.slice.call(grid.children).forEach(function(cell) {
            if (cell.dataset.ip) existing[cell.dataset.ip] = cell;
        });
        grid.innerHTML = '';
        for (var i = 0; i < lay.n; i++) {
            var ip = shown[i];
            if (ip) {
                var h = state.hosts.filter(function(x) { return x.ip === ip; })[0];
                var cell = existing[ip];
                if (!cell) {
                    cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.ip = ip;
                    var hh   = h || { ip: ip };
                    var kind = kindOf(hh);
                    if (kind === 'flashforge') {
                        ffCell(hh, cell);
                    } else if (kind === 'rtsp-url' || kind === 'rtsps') {
                        if (go2rtcPort) {
                            go2rtcCell(hh, cell, kind === 'rtsp-url' ? hh.ip : null);
                        } else {
                            ensureGo2rtc();
                            var wait = document.createElement('div');
                            wait.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;';
                            wait.textContent = 'Starting stream relay…';
                            cell.appendChild(wait);
                            cell.dataset.ip = ''; // rebuild this cell once the relay reports in
                        }
                    } else if (kind === 'p1') {
                        // The relay serves MJPEG, which renders in a plain <img>.
                        var im = document.createElement('img');
                        im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
                        im.src = streamSrc(hh);
                        cell.appendChild(im);
                    } else {
                        var f = document.createElement('iframe');
                        f.allow = 'autoplay';
                        f.src = streamSrc(hh);
                        cell.appendChild(f);
                    }
                    var lab = document.createElement('span');
                    lab.className = 'label';
                    cell.appendChild(lab);
                }
                cell.querySelector('.label').textContent = (h && h.alias) ? h.alias : ip;
                grid.appendChild(cell);
            } else {
                var empty = document.createElement('div');
                empty.className = 'cell empty';
                grid.appendChild(empty);
            }
        }
    }
    document.getElementById('addchip').onclick = function() {
        showModal({
            title: 'Add printer',
            fields: [
                { key: 'ip', label: 'IP address, hostname, or full stream URL (http/rtsp)', placeholder: 'e.g. 10.0.0.106' },
                { key: 'alias', label: 'Alias (optional)', placeholder: 'e.g. U1 Left' },
                { key: 'kind', label: 'Printer type', type: 'select', options: [
                    { value: 'auto',  label: 'Snapmaker / direct stream URL' },
                    { value: 'p1',    label: 'Bambu P1 / A1 (needs access code)' },
                    { value: 'rtsps', label: 'Bambu X1 / H2 (needs access code + LAN Liveview on)' },
                    { value: 'flashforge', label: 'Flashforge (Creator 5 / Adventurer 5M family)' }
                ] },
                { key: 'code', label: 'LAN access code (Bambu printers only)', placeholder: 'leave empty for Snapmaker / URLs' }
            ]
        }, function(r) {
            if (r === null || !r.ip) return;
            if (!validHost(r.ip) || state.hosts.some(function(h) { return h.ip === r.ip; })) return;
            if ((r.kind === 'p1' || r.kind === 'rtsps') && !r.code) return;
            state.hosts.push({ ip: r.ip, alias: r.alias || '', code: r.code || '', kind: r.kind || 'auto' });
            state.active.push(r.ip);
            save(); render();
        });
    };
    document.getElementById('layout').onchange = function() {
        state.layout = this.value;
        save(); render();
    };
    window.addEventListener('resize', function() { render(); });

    load();
    // Default: first host active in the default single-stream layout.
    if (state.active.length === 0 && state.hosts.length > 0) state.active = [state.hosts[0].ip];
    save();
    render();
})();
</script>
</body>
</html>
